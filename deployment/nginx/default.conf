# Reference reverse-proxy config (not used by docker-compose by default).
#
# Mount it into an nginx container that shares a network with the `api` service:
#   docker run --rm -p 80:80 --network ai-film-studio_default \
#     -v "$PWD/deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine

upstream film_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # novels and generated media travel through the API
    client_max_body_size 60m;

    # one place for security headers; the app itself sets none
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://film_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # In production the gateway terminates auth and injects the identity
        # headers the app expects (see ADR 0005); never forward client-supplied
        # X-User-* headers unvalidated.
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 300s;
    }

    # Server-Sent Events: buffering must be off or progress arrives in bursts,
    # and the read timeout has to outlive the longest task (render/export).
    location ~ ^/api/v1/projects/[^/]+/tasks/[^/]+/events/stream$ {
        proxy_pass http://film_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # generated media can be large; let nginx stream it straight through
    location /media/ {
        proxy_pass http://film_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://film_api;
        access_log off;
    }
}
