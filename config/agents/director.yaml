agent:
  id: director
  name: Director Agent
  enabled: true
  version: 1.0.0
  description: 根据已批准剧本制定导演规划：视觉风格、镜头策略、连续性规则。
model:
  provider: qwen
  model_id: qwen3.8-27b
  capability: text_reasoning
  fallback_provider: qwen
  fallback_model_id: qwen3.8-27b
  provider_options: {}
generation:
  temperature: 0.5
  top_p: 0.9
  seed: 42
  max_output_tokens: 4096
  timeout_seconds: 150
  max_retries: 2
structured_output:
  enabled: true
  schema_name: directing_plan
  validation_required: true
  repair_attempts: 1
prompt:
  system: prompts/director/system.md
  user_template: prompts/director/user.md
  version: 1.0.0
runtime:
  concurrency: 1
  cache_enabled: false
  human_review_required: false
evaluation:
  enabled: true
  checks:
    - schema_valid
    - completeness
  thresholds: {}
