agent:
  id: character_vision
  name: Character Vision Agent
  enabled: true
  version: 1.0.0
  description: 分析用户上传的角色参考图，输出外貌特征与视觉关键词。
model:
  provider: mock
  model_id: mock-vision
  capability: vision
  fallback_provider: mock
  fallback_model_id: mock-vision
  provider_options: {}
generation:
  temperature: 0.1
  max_output_tokens: 2048
  timeout_seconds: 120
  max_retries: 2
structured_output:
  enabled: true
  schema_name: character_vision
  validation_required: true
  repair_attempts: 1
prompt:
  system: prompts/character/vision_system.md
  user_template: prompts/character/vision_user.md
  version: 1.0.0
runtime:
  concurrency: 2
  cache_enabled: false
  human_review_required: false
evaluation:
  enabled: true
  checks:
    - schema_valid
  thresholds: {}
