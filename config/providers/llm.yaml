# 大模型供应商（文字推理类智能体：剧本、分镜、导演、剪辑等）。
#
# 每个供应商可写的字段（通俗版）：
#   enabled  : true 表示启用
#   protocol : 调用协议，这里是 openai_chat（OpenAI 及兼容接口都走这个）
#   url      : 接口地址；写 env:变量名 表示从环境变量读取
#   api_key  : 密钥；建议写 env:OPENAI_API_KEY（密钥本身放 .env），也可以直接粘贴密钥
#   models   : 该供应商支持的模型名，智能体文件里的 model_id 填这里的名字
#
# 例：用 DeepSeek —— 把下面 openai_compatible 的 enabled 改成 true，
#     url 写 https://api.deepseek.com/v1，api_key 写 env:DEEPSEEK_API_KEY，
#     再在 .env 里加 DEEPSEEK_API_KEY=你的密钥，最后在智能体文件里把
#     model.provider 改成 openai_compatible、model.model_id 改成 deepseek-chat。
providers:
  mock:
    enabled: true
    protocol: mock
    timeout_seconds: 120
    max_concurrency: 8
    models:
      - mock-llm

  openai:
    enabled: false
    protocol: openai_chat
    url: https://api.openai.com/v1
    api_key: env:OPENAI_API_KEY
    models:
      - gpt-4.1
      - gpt-4.1-mini
      - gpt-4o-mini
    timeout_seconds: 180
    max_concurrency: 4
    extra:
      input_cost_per_1k: 0.0004
      output_cost_per_1k: 0.0016
      supported_params:
        - temperature
        - top_p
        - max_output_tokens

  # 任意 OpenAI 兼容网关（vLLM、Azure 代理、阿里百炼兼容模式、DeepSeek 等）。
  openai_compatible:
    enabled: false
    protocol: openai_chat
    url: env:OPENAI_COMPAT_BASE_URL
    api_key: env:OPENAI_COMPAT_API_KEY
    models:
      - qwen-plus
      - deepseek-chat
    timeout_seconds: 180
    max_concurrency: 4
    extra:
      max_tokens_field: max_tokens

  # 本机 vLLM 上的 Qwen（http://127.0.0.1:8000/v1）。
  # 密钥写在 .env 的 QWEN_API_KEY 里（本机服务填任意字符串即可）。
  qwen:
    enabled: true
    protocol: openai_chat
    url: http://127.0.0.1:8000/v1
    api_key: env:QWEN_API_KEY
    models:
      - qwen3.8-27b
    timeout_seconds: 300
    max_concurrency: 2
    extra:
      max_tokens_field: max_tokens
      # 该服务要求每次请求都必须带思考强度，缺了会报
      # “Unexpected reasoning effort None”；可选 xhigh（默认，最慢）/ medium / low。
      request_defaults:
        reasoning_effort: medium
      # 本机模型不计费
      input_cost_per_1k: 0.0
      output_cost_per_1k: 0.0
