# Image providers (character portraits, turnaround sheets, costume sheets).
providers:
  mock:
    enabled: true
    kind: mock
    timeout_seconds: 120
    max_concurrency: 4
    models:
      - mock-image

  openai:
    enabled: false
    kind: openai_images
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
    base_url: https://api.openai.com/v1
    models:
      - gpt-image-1
      - dall-e-3
    timeout_seconds: 180
    max_concurrency: 2
    extra:
      protocol: openai_images
      unit_cost: 0.04

  local_comfy:
    enabled: false
    kind: openai_images
    api_key_env: LOCAL_IMAGE_API_KEY
    base_url_env: LOCAL_IMAGE_BASE_URL
    models:
      - flux-dev
    timeout_seconds: 300
    max_concurrency: 1
    extra:
      protocol: openai_images
