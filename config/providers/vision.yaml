# 画面理解供应商（人物形象一致性、角色视觉校验）。
#
# 字段说明见 llm.yaml 顶部：enabled / protocol / url / api_key / models。
providers:
  mock:
    enabled: true
    protocol: mock
    timeout_seconds: 120
    max_concurrency: 4
    models:
      - mock-vision

  openai:
    enabled: false
    protocol: openai_chat
    url: https://api.openai.com/v1
    api_key: env:OPENAI_API_KEY
    models:
      - gpt-4.1
      - gpt-4o-mini
    timeout_seconds: 180
    max_concurrency: 2
    extra:
      input_cost_per_1k: 0.0004
      output_cost_per_1k: 0.0016

  # 示例：本地/自建的多模态模型，通过 OpenAI 兼容接口暴露出来。
  local_vision:
    enabled: false
    protocol: openai_chat
    url: env:LOCAL_VISION_BASE_URL
    api_key: env:LOCAL_VISION_API_KEY
    models:
      - qwen-vl-max
    timeout_seconds: 120
    max_concurrency: 1
