# Audio providers (text-to-speech for dialogue / narration).
providers:
  mock:
    enabled: true
    kind: mock
    timeout_seconds: 120
    max_concurrency: 4
    models:
      - mock-tts

  openai:
    enabled: false
    kind: openai_speech
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
    base_url: https://api.openai.com/v1
    models:
      - gpt-4o-mini-tts
      - tts-1
    timeout_seconds: 180
    max_concurrency: 2
    extra:
      protocol: openai_speech
      unit_cost: 0.015

  local_tts:
    enabled: false
    kind: openai_speech
    api_key_env: LOCAL_TTS_API_KEY
    base_url_env: LOCAL_TTS_BASE_URL
    models:
      - cosyvoice
    timeout_seconds: 120
    max_concurrency: 2
    extra:
      protocol: openai_speech
