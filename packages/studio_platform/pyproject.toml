[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-platform"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "studio-contracts==1.0.0"
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
s3 = ["boto3>=1.34"]
queue = ["celery>=5.4", "redis>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]
