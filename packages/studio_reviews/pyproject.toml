[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-reviews"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "studio-characters==1.0.0",
    "studio-platform==1.0.0",
    "studio-production==1.0.0",
    "studio-projects==1.0.0",
    "studio-scenes==1.0.0",
    "studio-story==1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
