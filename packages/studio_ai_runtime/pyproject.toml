[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-ai-runtime"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "SQLAlchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "studio-contracts==1.0.0",
    "studio-platform==1.0.0",
    "studio-projects==1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
