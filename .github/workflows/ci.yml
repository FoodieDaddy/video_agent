name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend contracts and rendering boundaries
        run: node --test web/tests/*.test.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: test
      # mock providers only: the suite must never need a key or network access
      AGENT_MODEL_PROVIDER: mock
      FAST_GATEWAY_BASE_URL: https://ci.invalid/v1
      FAST_GATEWAY_MODEL: mock-llm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ffmpeg/ffprobe back the mock media generators, so rendering is real in CI
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Install pinned uv bootstrap
        run: python -m pip install --disable-pip-version-check uv==0.12.9

      - name: Synchronize packaged resources
        run: python scripts/sync_studio_resources.py

      - name: Install locked project dependencies
        run: uv sync --frozen --extra dev

      - name: Validate workspace lock and build all member wheels
        run: |
          uv lock --check
          uv build --all-packages --wheel --out-dir dist/workspace

      - name: Shared local and CI quality gate
        run: uv run --frozen --extra dev python scripts/checks/quality_gate.py

      - name: Test
        run: uv run --frozen --extra dev python scripts/checks/quality_gate.py --scope tests

      - name: Schemas are in sync with the pydantic models
        run: |
          uv run --frozen --extra dev python scripts/export_schemas.py
          git diff --exit-code -- config/schemas

      - name: Offline end-to-end smoke
        run: uv run --frozen --extra dev python scripts/checks/quality_gate.py --scope smoke

  posix-release:
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      AGENT_MODEL_PROVIDER: mock
      FAST_GATEWAY_BASE_URL: https://ci.invalid/v1
      FAST_GATEWAY_MODEL: mock-llm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media tools
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          elif ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
      - name: Install workspace tools
        run: |
          python -m pip install uv==0.12.9
          python scripts/sync_studio_resources.py
          uv sync --frozen --extra dev
      - name: Build platform release
        run: uv run --frozen --extra dev python scripts/build_releases.py --platform ${{ matrix.platform }}
      - name: Test installed lifecycle
        shell: bash
        run: |
          uv run --frozen --extra dev python -c "import pathlib,subprocess,sys; archive,=pathlib.Path('dist/releases').glob('*-${{ matrix.platform }}-source-bootstrap.tar.gz'); subprocess.run([sys.executable,'scripts/checks/posix_release_smoke.py','--release',str(archive),'--report-json','dist/releases/lifecycle-${{ matrix.platform }}.json'],check=True)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-${{ matrix.platform }}-release
          path: dist/releases/
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deployment/docker/Dockerfile -t ai-film-studio:ci .

      - name: Boot and probe the API
        run: |
          container_name="studio-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs --tail 20 "$container_name" || true
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$container_name" -p 8000:8000 -e AGENT_MODEL_PROVIDER=mock -e FAST_GATEWAY_BASE_URL=https://ci.invalid/v1 -e FAST_GATEWAY_MODEL=mock-llm ai-film-studio:ci
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl -fsS http://127.0.0.1:8000/api/v1/meta > /dev/null

  # Builds the Windows one-click installer. Manual trigger only: it downloads a CPython
  # runtime and ~200 MB of wheels, which is slow and noisy for pull requests.
  windows-installer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: test
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned uv bootstrap
        run: python -m pip install --disable-pip-version-check uv==0.12.9

      - name: Synchronize packaged resources
        run: python scripts/sync_studio_resources.py

      - name: Install locked project dependencies
        run: uv sync --frozen --extra dev

      - name: Validate Windows payload staging
        run: uv run --frozen --extra dev python -c "from scripts.build_installers import stage_payload; stage_payload()"

      # The script bootstraps its own build interpreter (python.org CPython) into build/
      # and fails the build if either exe cannot pass `--selftest` (e.g. broken _ssl).
      - name: Build install.exe and uninstall.exe
        run: uv run --frozen --extra dev python scripts/build_installers.py

      - name: Self test
        run: |
          .\dist\install.exe --selftest
          .\dist\uninstall.exe --selftest

      - name: Package Windows release with provenance
        run: uv run --frozen --extra dev python scripts/build_releases.py --platform windows --windows-exe-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/install.exe
            dist/uninstall.exe
            dist/windows-installers.json
            dist/releases/
          if-no-files-found: error
