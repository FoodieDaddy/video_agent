name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: test
      # mock providers only: the suite must never need a key or network access
      AGENT_MODEL_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ffmpeg/ffprobe back the mock media generators, so rendering is real in CI
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check backend

      - name: Test
        run: pytest -q

      - name: Schemas are in sync with the pydantic models
        run: |
          python scripts/export_schemas.py
          git diff --exit-code -- config/schemas

      - name: Offline end-to-end smoke
        run: python scripts/smoke_pipeline.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deployment/docker/Dockerfile -t ai-film-studio:ci .

      - name: Boot and probe the API
        run: |
          docker run -d --name studio -p 8000:8000 ai-film-studio:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/meta > /dev/null
          docker logs studio | tail -n 20
          docker rm -f studio

  # Builds the Windows one-click installer. Manual trigger only: it downloads a CPython
  # runtime and ~200 MB of wheels, which is slow and noisy for pull requests.
  windows-installer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: test
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script bootstraps its own build interpreter (python.org CPython) into build/
      # and fails the build if either exe cannot pass `--selftest` (e.g. broken _ssl).
      - name: Build install.exe and uninstall.exe
        run: python scripts/build_installers.py

      - name: Self test
        run: |
          .\dist\install.exe --selftest
          .\dist\uninstall.exe --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/install.exe
            dist/uninstall.exe
          if-no-files-found: error
