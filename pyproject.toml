[project]
name = "ai-film-studio"
version = "1.0.0"
description = "Modular AI film studio workspace"
requires-python = ">=3.11"
dependencies = ["studio-api==1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]
pdf = ["studio-platform[pdf]==1.0.0"]
s3 = ["studio-platform[s3]==1.0.0"]
queue = ["studio-platform[queue]==1.0.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/studio_api", "packages/*"]

[tool.uv.sources]
studio-api = { workspace = true }
studio-ai-runtime = { workspace = true }
studio-assets = { workspace = true }
studio-characters = { workspace = true }
studio-configuration = { workspace = true }
studio-contracts = { workspace = true }
studio-platform = { workspace = true }
studio-production = { workspace = true }
studio-projects = { workspace = true }
studio-reviews = { workspace = true }
studio-scenes = { workspace = true }
studio-story = { workspace = true }
studio-workflow = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["apps/studio_api/src", "packages/studio_ai_runtime/src", "packages/studio_assets/src", "packages/studio_characters/src", "packages/studio_configuration/src", "packages/studio_contracts/src", "packages/studio_platform/src", "packages/studio_production/src", "packages/studio_projects/src", "packages/studio_reviews/src", "packages/studio_scenes/src", "packages/studio_story/src", "packages/studio_workflow/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["packages/studio_contracts/src", "packages/studio_reviews/src"]
files = ["packages/studio_contracts/src/studio_contracts", "packages/studio_reviews/src/studio_reviews/domain"]
namespace_packages = true
explicit_package_bases = true
strict = true
ignore_missing_imports = false
