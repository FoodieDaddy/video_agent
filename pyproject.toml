[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-film-studio"
version = "1.0.0"
description = "Configurable, extensible multi-agent AI film production platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "Pillow>=10.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
s3 = ["boto3>=1.34"]
queue = ["celery>=5.4", "redis>=5.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
# 渐进门禁：先严格检查纯契约（含 public 导出）与已有纯领域规则。
# 扩大范围时应先补齐类型，不使用 ignore_errors 掩盖边界。
files = ["backend/app/modules/contracts", "backend/app/modules/reviews/domain"]
namespace_packages = true
explicit_package_bases = true
strict = true
ignore_missing_imports = false
