<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Film Studio</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header>
  <h1>AI Film Studio</h1>
  <span class="env" id="env-label">…</span>
  <span class="pill" id="health-pill">检查中</span>
  <span class="spacer"></span>
  <label class="small muted" for="user-input">开发者身份</label>
  <input id="user-input" value="user_demo" title="X-User-Id 请求头" />
  <select id="role-input" title="X-User-Role 请求头" style="width:110px">
    <option value="admin">admin</option>
    <option value="user">user</option>
  </select>
</header>

<main>
  <aside>
    <h2>项目 / Projects</h2>
    <div class="stack">
      <input id="project-name" placeholder="新项目名称，例如：雨夜书店" />
      <div class="row">
        <button class="primary" id="create-project">新建项目</button>
        <button id="refresh-projects">刷新</button>
      </div>
    </div>
    <div class="project-list" id="project-list" style="margin-top:12px"></div>
  </aside>

  <div class="stack">
    <section class="panel">
      <h2>项目首页 / Dashboard</h2>
      <div class="row" style="margin-bottom:10px">
        <button class="primary" id="btn-full-run">一键完整流程</button>
        <button id="btn-sample">导入示例小说</button>
        <button id="btn-analyze">剧本解析</button>
        <button id="btn-directing">导演规划</button>
        <button id="btn-storyboard">生成分镜</button>
        <button id="btn-character-assets">角色形象</button>
        <button id="btn-video">生成视频</button>
        <button id="btn-audio">生成配音</button>
        <button id="btn-editing">编排时间线</button>
        <button id="btn-render">合成成片</button>
        <button id="btn-evaluate">质量评估</button>
        <button id="btn-export">导出 MP4</button>
      </div>
      <div id="dashboard" class="muted">请选择或新建一个项目。</div>
    </section>

    <section class="panel">
      <h2>任务与日志 / Task log</h2>
      <div class="row" style="margin-bottom:8px">
        <span class="pill" id="task-pill">idle</span>
        <span class="small muted" id="task-label"></span>
        <span class="spacer"></span>
        <button id="clear-log">清空</button>
      </div>
      <div class="bar" style="margin-bottom:8px"><span id="task-bar"></span></div>
      <div id="log"></div>
    </section>

    <section class="panel">
      <h2>工作台 / Workbench</h2>
      <div class="tabs" id="tabs"></div>
      <div id="workbench" class="muted">选择项目后加载。</div>
    </section>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
