<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fa" />
    <meta
      name="description"
      content="片场 Studio · 让每一个故事，走向银幕。AI Film Studio 智能影视创作工作台。"
    />
    <title>片场 Studio · AI Film Studio</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳转到主要内容</a>
    <button class="sidebar-scrim" id="sidebar-scrim" aria-label="关闭导航" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <a class="brand" href="#overview" aria-label="片场 Studio 首页">
        <span class="brand-mark" aria-hidden="true"
          ><svg viewBox="0 0 28 28" fill="none">
            <path
              d="M5 10h18v13H5zM5 7l17-4 1 5-17 4z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <path
              d="m9 6 3 4m4-6 3 4M10 16h8m-8 3h5"
              stroke="currentColor"
              stroke-width="1.6"
            /></svg
        ></span>
        <span
          ><strong>片场<span class="brand-serif"> Studio</span></strong
          ><small>STORIES, IN MOTION.</small></span
        >
      </a>
      <div class="workspace-switch">
        <span class="workspace-letter">S</span><span>我的创作空间<small>个人工作室</small></span
        ><span class="switch-chevron">⌄</span>
      </div>
      <p class="nav-caption">创作空间 <span>WORKSPACE</span></p>
      <nav class="nav-list" id="primary-nav"></nav>
      <div class="sidebar-bottom">
        <div class="inspiration">
          <span class="inspiration-line"></span>
          <p>好故事的下一站，<br /><em>是银幕。</em></p>
          <span class="inspiration-note">YOUR NEXT FRAME STARTS HERE</span>
        </div>
        <a class="sidebar-help" href="/docs" target="_blank" rel="noopener"
          ><span data-icon="book"></span>创作指南与接口文档<span class="tiny-arrow">↗</span></a
        >
        <button class="profile-button" data-action="navigate" data-view="settings">
          <span class="avatar">创</span
          ><span><strong>独立创作者</strong><small>个人工作空间</small></span
          ><span data-icon="settings"></span>
        </button>
      </div>
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <div class="breadcrumb">
          <button
            class="icon-button mobile-menu"
            id="menu-toggle"
            aria-label="展开导航"
            aria-expanded="false"
          >
            <span data-icon="menu"></span></button
          ><span>工作空间</span><span class="crumb-slash">/</span
          ><strong id="breadcrumb-current">创作概览</strong>
        </div>
        <div class="topbar-actions">
          <div class="search-wrap">
            <span data-icon="search"></span
            ><input
              id="global-search"
              type="search"
              role="combobox"
              placeholder="搜索项目或功能…"
              aria-label="搜索项目或功能"
              autocomplete="off"
              aria-autocomplete="list"
              aria-controls="search-results"
              aria-expanded="false"
            /><kbd>⌘ K</kbd>
            <div
              class="search-results"
              id="search-results"
              role="listbox"
              aria-label="项目与功能搜索结果"
              hidden
            ></div>
          </div>
          <button class="mode-pill" id="mode-pill" data-action="navigate" data-view="settings">
            <span class="status-dot"></span><span>连接中</span>
          </button>
          <button
            class="icon-button notification-button"
            data-action="activity"
            aria-label="查看任务与活动"
          >
            <span data-icon="bell"></span><i></i>
          </button>
          <span class="topbar-divider"></span
          ><span class="avatar small-avatar" aria-label="独立创作者">创</span>
        </div>
      </header>
      <main id="main-content" tabindex="-1">
        <div class="initial-loader">
          <span class="loader-ring"></span>
          <p>正在准备你的片场…</p>
        </div>
      </main>
      <footer class="page-footer">
        <span>片场 STUDIO <b>·</b> 让灵感成为作品</span
        ><span id="footer-mode">正在读取项目数据</span>
      </footer>
    </div>
    <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>
    <dialog id="studio-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <noscript><div class="noscript-message">请启用 JavaScript 以使用创作工作台。</div></noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
